# Deploiement du site sur Cloudflare Workers (fichiers statiques).
#
# Le site n'est pas servi depuis la racine du depot : build.sh construit
# dist/ avec le seul contenu public et laisse de cote ce qui est interne.
# C'est dist/ qui part en ligne.
#
# Reglages attendus dans l'interface Cloudflare :
#   Commande de build    : bash build.sh
#   Commande de deploiement : npx wrangler deploy

name = "grafycom"
compatibility_date = "2026-01-01"

# Le Worker sert le site et traite le formulaire de contact sur /api/contact.
main = "src/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"
# Les adresses inconnues reçoivent la page 404 du site, pas celle de Cloudflare.
not_found_handling = "404-page"
# Servir /prestations.html tel quel. Par defaut, Cloudflare retire le .html
# et redirige en 307 vers /prestations. Or le site porte 1101 liens internes
# en .html, son sitemap 26 adresses en .html, et chaque page declare une
# canonique en .html. Avec le comportement par defaut : une redirection a
# chaque clic, et une canonique qui designe une adresse qui redirige - ce
# que Google interprete mal. Les adresses restent donc celles qui sont
# deja indexees.
html_handling = "none"
# Seul /api/* passe par le code ; tout le reste est servi directement depuis
# le stockage d'assets, sans invoquer le Worker.
# /admin doit passer par le code : sans cette ligne, la requete va
# directement au stockage d'assets, qui ne connait pas cette adresse et
# repond 404. Le back-office ne serait jamais appele - ni sa garde.
run_worker_first = [ "/api/*", "/", "/admin", "/admin/*" ]

# ---------------------------------------------------------------------
# Envoi du formulaire de contact.
#
# Plus aucune cle d'API : le droit d'envoyer vient du lien ci-dessous,
# pas d'un secret a renouveler. Les deux adresses ne sont pas secretes -
# celle de Sandra figure deja en clair sur la page contact - et les voir
# ici vaut mieux que d'aller les chercher dans une interface.
#
# destination_address verrouille le lien sur une seule adresse. Si
# quelqu'un detournait un jour le formulaire, il ne pourrait toujours
# ecrire qu'a Sandra. C'est aussi ce qui rend l'envoi gratuit : vers une
# destination verifiee du compte, Cloudflare ne facture rien, sur toutes
# les offres.
#
# Les deux adresses doivent rester identiques. Changer l'une sans
# l'autre fait echouer l'envoi.
# ---------------------------------------------------------------------
[[send_email]]
name = "EMAIL"
destination_address = "sandra.grafycom@gmail.com"

[vars]
# Doit etre la meme que destination_address ci-dessus.
CONTACT_TO = "sandra.grafycom@gmail.com"
# Le domaine doit etre integre au service d'envoi de Cloudflare, sinon
# l'envoi est refuse. La boite n'a pas besoin d'exister pour autant :
# c'est une adresse d'expedition, les reponses partent vers le visiteur
# par l'en-tete Reply-To.
CONTACT_FROM = "contact@grafycom.fr"

# ---------------------------------------------------------------------
# Back-office — /admin
#
# Garde : Cloudflare Access. Laurent se connecte avec son compte
# Cloudflare ; il n'y a pas de mot de passe a inventer, donc pas de mot
# de passe a perdre. Le Worker ne se contente pas de croire l'en-tete
# d'Access : il verifie la signature du jeton et son audience.
#
# FERME PAR DEFAUT. Tant que les deux valeurs ci-dessous sont vides,
# /admin/* repond 403 - y compris entre le deploiement et le moment ou
# l'application Access sera creee. Il n'y a donc aucune fenetre ouverte.
#
# A renseigner une fois l'application Access creee (Zero Trust > Access
# > Applications > Add, self-hosted, domaine grafycom.fr, chemin /admin) :
#   ADMIN_TEAM  le nom d'equipe Zero Trust, sans .cloudflareaccess.com
#   ADMIN_AUD   le « Application Audience (AUD) Tag » de l'application
# Ce ne sont pas des secrets : ils identifient, ils n'autorisent pas.
# ---------------------------------------------------------------------
ADMIN_TEAM = ""
ADMIN_AUD = ""

# Les publications en attente de relecture. Rien de personnel n'y entre :
# ni prospect, ni client, seulement ce qui est destine a etre publie.
[[d1_databases]]
binding = "DB"
database_name = "grafycom-publications"
database_id = "bfa19a4a-2a9c-4053-bf1d-5a14105b42cb"

# Les photos deposees dans le back-office. Elles ne vont pas dans le
# depot : une photo de 3 Mo n'a rien a faire dans un historique git, qui
# ne l'oublierait jamais. Elles ne sont pas servies publiquement non
# plus - Laurent les telecharge pour les poster lui-meme.
#
# A DECOMMENTER une fois R2 active dans le tableau de bord Cloudflare et
# le seau cree. Declarer un seau qui n'existe pas fait echouer le
# deploiement, et le site resterait sur sa version precedente.
# [[r2_buckets]]
# binding = "FICHIERS"
# bucket_name = "grafycom-photos"
