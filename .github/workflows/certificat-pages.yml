# Lire l'état du certificat HTTPS du domaine personnalisé.
#
# POURQUOI UN WORKFLOW
# L'API Pages est refusée par le proxy de l'environnement où ce dépôt est
# maintenu : 403 sur la route /pages, alors que le reste de l'API répond.
# Un workflow s'exécute chez GitHub, sans ce proxy, et peut la lire.
#
# CE QU'IL A SERVI À TROUVER, le 7 octobre 2026
# L'état du certificat disait :
#
#   state       : dns_changed
#   description : Detected a change to DNS settings. Requesting a new
#                 certificate.
#   domains     : grafycom.fr, www.grafycom.fr
#
# GitHub demande un seul certificat pour les DEUX noms. Or
# www.grafycom.fr n'a aucun enregistrement DNS (NXDOMAIN). L'autorité de
# certification valide chaque nom de la demande : celle du www échoue,
# donc aucun certificat n'est émis — pas même pour l'apex, qui est
# pourtant correctement configuré.
#
# Le blocage n'est donc pas chez GitHub mais dans la zone DNS, et il se
# lève en créant un seul enregistrement :
#
#   www.grafycom.fr.  CNAME  rezofabrik-hub.github.io.
#
# CE QUE CE WORKFLOW NE FAIT PAS
# Il ne modifie rien. L'écriture a été tentée et refusée : le
# GITHUB_TOKEN d'une exécution n'a pas le droit de modifier la
# configuration Pages (403 « Resource not accessible by integration »),
# même avec la permission pages: write. Il faudrait un jeton personnel.
# Inutile ici : la configuration est correcte, c'est le DNS qui bloque.

name: Certificat Pages

on:
  workflow_dispatch:

permissions:
  pages: read

jobs:
  etat:
    runs-on: ubuntu-latest
    steps:
      - name: État du domaine et du certificat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages" > etat.json
          echo "## État Pages" >> "$GITHUB_STEP_SUMMARY"
          jq -r '
            "- domaine : `\(.cname // "aucun")`",
            "- HTTPS imposé : `\(.https_enforced)`",
            "- état du certificat : `\(.https_certificate.state // "aucun")`",
            "- description : \(.https_certificate.description // "-")",
            "- noms couverts : `\((.https_certificate.domains // []) | join("`, `"))`"
          ' etat.json | tee -a "$GITHUB_STEP_SUMMARY"
          # Les journaux et le resume sont servis depuis un hote que le
          # proxy de maintenance ne joint pas ; les annotations passent
          # par l'API. On y recopie donc l'essentiel.
          jq -r '"::notice title=Pages::domaine=\(.cname // "aucun") | https_enforced=\(.https_enforced) | certificat=\(.https_certificate.state // "aucun") | noms=\((.https_certificate.domains // []) | join(","))"' etat.json
          jq -r '"::notice title=Certificat::\(.https_certificate.description // "-")"' etat.json

      - name: Chaque nom du certificat résout-il ?
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Résolution DNS des noms du certificat" >> "$GITHUB_STEP_SUMMARY"
          manquant=0
          for d in $(jq -r '(.https_certificate.domains // [])[]' etat.json); do
            if getent hosts "$d" > /dev/null 2>&1; then
              echo "- \`$d\` : résout" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::notice title=DNS::$d resout"
            else
              echo "- \`$d\` : **NE RÉSOUT PAS** — bloque l'émission du certificat pour tous les noms" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::error title=DNS::$d NE RESOUT PAS - bloque l emission du certificat pour tous les noms"
              manquant=1
            fi
          done
          if [ "$manquant" = "1" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Créer l'enregistrement manquant chez l'hébergeur DNS, puis relancer ce workflow." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Un nom du certificat ne résout pas : aucun certificat ne sera émis."
          fi

      - name: Le site répond-il en HTTPS ?
        run: |
          # Les tests TLS faits depuis l'environnement de maintenance
          # traversent un proxy qui presente son propre certificat : ils ne
          # disent rien du vrai. Ici, la connexion est directe.
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Réponse réelle du site" >> "$GITHUB_STEP_SUMMARY"
          for u in https://grafycom.fr/ https://www.grafycom.fr/ http://grafycom.fr/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$u" || echo "000")
            echo "- \`$u\` : $code" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::notice title=HTTP::$u -> $code"
          done
          echo "::notice title=Certificat servi::$(echo | openssl s_client -servername grafycom.fr -connect grafycom.fr:443 2>/dev/null | openssl x509 -noout -issuer -ext subjectAltName 2>/dev/null | tr '\n' ' ' | tr -s ' ' || echo aucun)"
